<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SunSet - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'menu' %}">SunSet 🌅</a>
        <div class="d-flex">
            {% if user.is_authenticated %}
                <a href="{% url 'menu' %}" class="btn btn-outline-light me-2">Menú</a>
                <a href="{% url 'cocina' %}" class="btn btn-outline-light me-2">Cocina</a>
                <a href="{% url 'perfil' %}" class="btn btn-outline-light me-2">Perfil</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger">Salir</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light">Iniciar sesión</a>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
